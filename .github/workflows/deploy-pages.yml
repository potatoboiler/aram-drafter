name: deploy pages action

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

jobs:
  if_merged:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: install deps
        run: npm ci

      - name: build
        run: npm run build

      - uses: fregante/setup-git-user@v2
      - name: deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run deploy -- --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
